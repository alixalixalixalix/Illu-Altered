<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" type="image/x-icon" href="icon.png" />
    <title>ILLU | ALTERED</title>
    <link rel="stylesheet" href="https://use.typekit.net/kja0rbw.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div>
        <div>
          <label for="set">EXTENSION</label>
          <select name="set" id="set">
            <option value="set1">SET 1 : Au-delà des Portes</option>
            <option value="set2">SET 2 : L'Épreuve du Froid</option>
            <option value="set3" selected>
              SET 3 : Murmures du Labyrinthe
            </option>
            <option value="set4">SET 4 : Odyssée des Cieux</option>
            <option value="set5">SET 5 : Les Graines de l'Unité</option>
            <option value="set6">SET 6 : Les Racines de la Corruption</option>
            <option value="set7">SET 7 : La Traversée Éternelle</option>
          </select>
        </div>
        <div>
          <label for="faction">FACTION</label>
          <select name="faction" id="faction">
            <option value="toutes" selected>Toutes</option>
            <option value="axiom">Axiom</option>
            <option value="bravos">Bravos</option>
            <option value="lyra">Lyra</option>
            <option value="muna">Muna</option>
            <option value="ordis">Ordis</option>
            <option value="yzmir">Yzmir</option>
          </select>
        </div>
        <div>
          <label for="tri">TRI PAR</label>
          <select name="tri" id="tri">
            <option value="num" selected>Numéro cartes</option>
            <option value="alpha">Alphabétique</option>
            <option id="nbVotes" value="nbVotes">Nombre votes</option>
          </select>
        </div>
        <div>
          <label for="nbColonne">NB COLONNE</label>
          <select name="nbColonne" id="nbColonne">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4" selected>4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div id="filtre-visible">
          <img src="icon-invisible.svg" alt="">
          <p>Masquer votes</p>
        </div>
      </div>
    </header>

    <section id="filtres">
      <div id="containerRarete">
        <p>Rareté</p>
        <button id="button-commune">Commune</button>
        <button id="button-rare">Rare</button>
        <button id="button-unique" class="rareteActive">Unique</button>
        <a href=""
          ><img src="info.svg" alt="" /><span
            >Seules les cartes personnages possèdent une illustration
            unique</span
          ></a
        >
      </div>
    </section>

    <div id="containerCartes"></div>
    <script type="text/javascript" src="script.js"></script>
  </body>
</html>
